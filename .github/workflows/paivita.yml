name: Päivitä data
on:
  schedule:
    - cron: "17 3 * * *"          # joka yö (UTC) – n. klo 6 Suomen aikaa
    - cron: "17 10-20/3 * 4-9 *"   # kaudella (huhti–syys) 3 h välein päivällä
  workflow_dispatch:
    inputs:
      kausi:
        description: "Kausi"
        default: "2026"
permissions:
  contents: write
concurrency: paivita
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ydin.paivita --kausi ${{ github.event.inputs.kausi || '2026' }}
      - name: Tallenna muutokset
        run: |
          git config user.name "ydin-bot"
          git config user.email "ydin-bot@users.noreply.github.com"
          git add data/out
          git diff --cached --quiet || git commit -m "Data päivitetty $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
