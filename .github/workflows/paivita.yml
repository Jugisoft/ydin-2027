name: Päivitä data
on:
  schedule:
    - cron: "5 19 * * *"   # 22.05 Suomen kesäaikaa (UTC+3)
    - cron: "5 20 * * *"   # 22.05 Suomen talviaikaa (UTC+2)
  push:
    branches: [main]
    paths: ["web/**", "ydin/**", "data/seuranta/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      kausi:
        description: "Kausi"
        default: "2026"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: paivita
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ydin.paivita --kausi ${{ github.event.inputs.kausi || '2026' }}
      - run: python -m ydin.historia
      - run: python -m ydin.lukkarit
      - name: Tallenna data
        run: |
          git config user.name "ydin-bot"
          git config user.email "ydin-bot@users.noreply.github.com"
          git add data/out
          git diff --cached --quiet || git commit -m "Data päivitetty $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Rakenna sivusto
        run: python -m ydin.sivu
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: julkaisu
        uses: actions/deploy-pages@v4
