name: Päivitä data
on:
  schedule:
    - cron: "30 18 * * *"  # 21.30 Suomen kesäaikaa (UTC+3), Jugi 16.10.2026
    - cron: "30 19 * * *"  # 21.30 Suomen talviaikaa (UTC+2); kesällä toinen ajo klo 22.30 hakee vain myöhään päättyneet
    - cron: "20 16 * * *"  # 18.20 talviaikaa: Jarvisin siirtoseuranta (iltatehtävä 17.48) julkaistaan heti, 30.10.2026
  push:
    branches: [main]
    paths: ["web/**", "ydin/**", "data/seuranta/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      kausi:
        description: "Kausi (tyhjä = uusin)"
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: paivita
jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ydin.paivita ${{ github.event.inputs.kausi && format('--kausi {0}', github.event.inputs.kausi) || '' }}
      - name: Ottelutapahtumat (1 haku / uusi päättynyt ottelu) ja lyöntikartat
        run: |
          python -m ydin.tapahtumat ${{ github.event.inputs.kausi && format('--kausi {0}', github.event.inputs.kausi) || '' }}
          python -m ydin.lyonnit ${{ github.event.inputs.kausi && format('--kausi {0}', github.event.inputs.kausi) || '' }}
      - run: python -m ydin.historia
      - run: python -m ydin.lukkarit
      - name: Siirtoseuranta KPL Keskuksen kautta (Jarvis, 30.10.2026)
        continue-on-error: true
        run: |
          curl -fsS --max-time 30 https://xytpwmzcghixulnzdakv.supabase.co/functions/v1/ydin-seuranta -o /tmp/seuranta.json
          python -c "import json; d=json.load(open('/tmp/seuranta.json', encoding='utf-8')); assert isinstance(d.get('siirrot'), list) and d['siirrot'], 'siirrot puuttuu'"
          if cmp -s /tmp/seuranta.json data/seuranta/seuranta.json; then echo "Seuranta ennallaan"; else cp /tmp/seuranta.json data/seuranta/seuranta.json; echo "Seuranta päivitetty Keskuksesta"; fi
      - run: python -m ydin.siirtovaikutus
      - name: Tallenna data
        run: |
          git config user.name "ydin-bot"
          git config user.email "ydin-bot@users.noreply.github.com"
          git add data/out data/tapahtumat data/seuranta
          git diff --cached --quiet || git commit -m "Data päivitetty $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Rakenna sivusto
        run: python -m ydin.sivu
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: julkaisu
        uses: actions/deploy-pages@v4
