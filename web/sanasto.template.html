const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const hl = (s, q) => { const t = esc(s); if(!q) return t; const i = norm(t).indexOf(q); return i<0 ? t : t.slice(0,i)+`<mark class="hl">${t.slice(i,i+q.length)}</mark>`+t.slice(i+q.length); };
$("jump").innerHTML = S.map(([id,o])=>`<a href="#${id}">${esc(o)}</a>`).join("");
function render(){
  const q = norm($("q").value.trim());
  let n = 0;
  $("sections").innerHTML = S.map(([id,o,sivu,intro,T])=>{
    const R = T.filter(t=>!q || norm(t.join(" ")).includes(q) || norm(o).includes(q));
    if(!R.length) return ""; n += R.length;
    return `<section class="card sec" id="${id}"><div class="head"><h3>${esc(o)}</h3>${sivu?`<a class="more" href="${sivu}">Avaa sivu →</a>`:""}</div>${intro?`<p>${esc(intro)}</p>`:""}
      <dl class="terms">${R.map(([l,nm,sel,calc,dir])=>`<dt><b>${hl(l,q)}</b><span>${hl(nm,q)}</span></dt><dd><p>${hl(sel,q)}${dir===UP?`<span class="dir up">suurempi parempi</span>`:dir===DN?`<span class="dir dn">pienempi parempi</span>`:""}</p>${calc?`<div class="calc">Laskenta: ${calc}</div>`:""}</dd>`).join("")}</dl></section>`;
  }).join("");
  $("ei").hidden = n>0;
}
$("q").addEventListener("input", render);
