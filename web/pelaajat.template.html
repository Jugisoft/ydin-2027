<script>
const DATA = __DATA__;
const F = DATA.kentat;
const SUM = ["O","K","L","T","KL","KLY","KL0","KLY0","KL1","KLY1","KL2","KLY2","KL3","KLY3","LV","LY","TY"];
const pct = (a,b)=> b ? 100*a/b : null;
const fmtP = v => v==null ? "–" : v.toFixed(1).replace(".",",");
const PESA = ["kotipesältä","1. pesältä","2. pesältä","3. pesältä"];

function rows(v){
  const toObj = r => Object.fromEntries(F.map((k,i)=>[k,r[i]]));
  if(v!=="kaikki") return DATA.vaiheet[v].map(toObj);
  const m = new Map();
  for(const ph of Object.keys(DATA.vaiheet)) for(const r of DATA.vaiheet[ph]){
    const o = toObj(r), cur = m.get(o.id);
    if(!cur){m.set(o.id,o);continue}
    for(const k of SUM) cur[k]+=o[k];
  }
  return [...m.values()];
}
function enrich(p){
  p.YHT=p.K+p.L+p.T; p.KLp=pct(p.KL,p.KLY);
  for(let n=0;n<4;n++) p["KLp"+n]=pct(p["KL"+n],p["KLY"+n]);
  p.Lp=pct(p.L,p.LY||0); p.Tp=pct(p.T,p.TY||0);
  return p;
}

/* Näkymät (vanhan YDINin välilehtien vastineet stats-tool-datalla):
   cols: [avain, otsikko, solun html, luokka, title]; min: yrityskenttä liukusäätimelle; pk: lukuarvo bar-palkkiin */
const bar = (v, a, b) => `<span class="bar"><b>${fmtP(v)}</b><i><b style="width:${v??0}%"></b></i></span>`;
const pc_ = (v, a, b, t) => `<span title="${a}/${b}">${fmtP(v)}</span>`;
const BASE = [["O","O",p=>p.O],["KandL","K+L",p=>`${p.K}+${p.L}`],["T","T",p=>p.T],["YHT","YHT",p=>p.YHT,"yht"]];
const VIEWS = {
  tilastot: {def:0, nimi:"Kausitilastot", min:"KLY", sort:"YHT", ohje:"Lyöntitilastot pesistulokset.fi-muodossa.",
    cols:[...BASE,["KL","KL",p=>p.KL],["KLY","KLY",p=>p.KLY],["KLp","KL%",p=>bar(p.KLp),"pc"],
      ["KLp0","KL%0",p=>pc_(p.KLp0,p.KL0,p.KLY0),"pb"],["KLp1","KL%1",p=>pc_(p.KLp1,p.KL1,p.KLY1),"pb"],["KLp2","KL%2",p=>pc_(p.KLp2,p.KL2,p.KLY2),"pb"],["KLp3","KL%3",p=>pc_(p.KLp3,p.KL3,p.KLY3),"pb"]]},
  kotiuttajat: {def:10, nimi:"Kotiuttajat", min:"KLY3", sort:"KLp3", ohje:"Kärkilyönnit 3. pesältä eli kotiutukset: onnistuuko lyöjä tuomaan kolmospesän etenijän kotiin.",
    cols:[["O","O",p=>p.O],["KL3","KL3",p=>p.KL3],["KLY3","KLY3",p=>p.KLY3],["KLp3","KL%3",p=>bar(p.KLp3),"pc"],["L","L",p=>p.L],["YHT","YHT",p=>p.YHT,"yht"],["KLp","KL% kaikki",p=>fmtP(p.KLp)]]},
  kentalle: {def:10, nimi:"Kentällemenijät", min:"KLY0", sort:"KLp0", ohje:"Kärkilyönnit kotipesältä: pääseekö lyöjä itse kentälle, kun pesillä ei ole etenijöitä edellä.",
    cols:[["O","O",p=>p.O],["KL0","KL0",p=>p.KL0],["KLY0","KLY0",p=>p.KLY0],["KLp0","KL%0",p=>bar(p.KLp0),"pc"],["T","T",p=>p.T],["Tp","T%",p=>pc_(p.Tp,p.T,p.TY)],["YHT","YHT",p=>p.YHT,"yht"]]},
  tilanteet: {def:10, nimi:"Tilanteet", min:"KLY1", sort:"KLp1", ohje:"Kärkilyönnit 1. ja 2. pesältä eli 1- ja 2-tilanteiden purku.",
    cols:[["O","O",p=>p.O],["KL1","KL1",p=>p.KL1],["KLY1","KLY1",p=>p.KLY1],["KLp1","KL%1",p=>bar(p.KLp1),"pc"],["KL2","KL2",p=>p.KL2],["KLY2","KLY2",p=>p.KLY2],["KLp2","KL%2",p=>bar(p.KLp2),"pc"]]},
  onnistuminen: {def:10, nimi:"Onnistuminen", min:"LY", sort:"Lp", ohje:"L% = lyödyt / lyöntiyritykset (etenijä kotiin lyönnillä). T% = tuodut / juoksuyritykset (pelaaja itse kotiin).",
    cols:[["O","O",p=>p.O],["L","L",p=>p.L],["LY","L yrit.",p=>p.LY],["Lp","L%",p=>bar(p.Lp),"pc"],["T","T",p=>p.T],["TY","T yrit.",p=>p.TY],["Tp","T%",p=>bar(p.Tp),"pc"],["YHT","YHT",p=>p.YHT,"yht"]]},
  muutos: {def:20, nimi:"Pudotuspelit vs. runkosarja", min:"KLYpo", sort:"dKL", ohje:"Pudotuspelien (ylempi jatkosarja) luvut verrattuna saman pelaajan runkosarjaan. Muutos = pudotuspelit − runkosarja.",
    cols:[["Opo","O pudotus",p=>p.Opo],["KLpr","KL% runko",p=>fmtP(p.KLpr)],["KLppo","KL% pudotus",p=>pc_(p.KLppo,p.KLpo,p.KLYpo)],["dKL","Muutos",p=>muutos(p.dKL),"yht"],
      ["YHTr","YHT/O runko",p=>fmtP(p.YHTr)],["YHTpo","YHT/O pudotus",p=>fmtP(p.YHTpo)],["dYHT","Muutos",p=>muutos(p.dYHT)]]},
};
function muutos(v){ if(v==null) return "–"; const c = v>0.05?"var(--win)":v<-0.05?"var(--loss)":"var(--muted)"; return `<span style="color:${c}">${v>0?"+":""}${fmtP(v)}</span>`; }
function muutosRivit(){
  const R = new Map(rows("runko").map(enrich).map(p=>[p.id,p])), P = (DATA.vaiheet.jatko_ylempi?rows("jatko_ylempi"):[]).map(enrich);
  return P.filter(p=>R.has(p.id)).map(p=>{ const r=R.get(p.id);
    return {...r, Opo:p.O, KLpo:p.KL, KLYpo:p.KLY, KLppo:p.KLp, KLpr:r.KLp, dKL: p.KLp!=null&&r.KLp!=null ? p.KLp-r.KLp : null,
      YHTr: r.O? r.YHT/r.O : null, YHTpo: p.O? p.YHT/p.O : null, dYHT: r.O&&p.O ? p.YHT/p.O - r.YHT/r.O : null}; });
}
const st = {v:"runko", nk:"tilastot", jk:null, q:"", min:0, sort:"YHT", dir:-1, sel:null};
try{ const s=JSON.parse(localStorage.getItem("ydin-pelaajat")||"{}"); Object.assign(st,{v:s.v||st.v,sort:s.sort||st.sort,dir:s.dir||st.dir,nk:VIEWS[s.nk]?s.nk:"tilastot"}); }catch(e){}
const save=()=>{try{localStorage.setItem("ydin-pelaajat",JSON.stringify({v:st.v,sort:st.sort,dir:st.dir,nk:st.nk}))}catch(e){}};

const $ = id=>document.getElementById(id);
$("kausi").textContent = DATA.kausi;
$("stamp").textContent = "Päivitetty " + new Date(DATA.paivitetty).toLocaleString("fi-FI",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});

let ALL=[];
function load(){ ALL = st.nk==="muutos" ? muutosRivit() : rows(st.v).map(enrich); if(!ALL.find(p=>p.id===st.sel)) st.sel=null; buildChips(); render(); }

function buildChips(){
  const teams=[...new Set(ALL.map(p=>p.jk))].sort((a,b)=>a.localeCompare(b,"fi"));
  if(st.jk && !teams.includes(st.jk)) st.jk=null;
  $("chips").innerHTML = ["Kaikki",...teams].map(t=>`<button class="chip" data-t="${t}" aria-pressed="${(t==="Kaikki"&&!st.jk)||t===st.jk}">${t}</button>`).join("");
}

function leaders(list){
  const q = list.filter(p=>p.KLY>=20);
  const top=(arr,key)=>arr.slice().sort((a,b)=>(b[key]??-1)-(a[key]??-1))[0];
  const L=[
    {lab:"Eniten YHT",p:top(list,"YHT"),val:p=>p.YHT,sub:p=>`${p.K}+${p.L} · ${p.T} T`},
    {lab:"Paras KL% (väh. 20 KLY)",p:top(q,"KLp"),val:p=>fmtP(p.KLp)+" %",sub:p=>`${p.KL}/${p.KLY}`},
    {lab:"Eniten kunnareita",p:top(list,"K"),val:p=>p.K,sub:p=>`${p.O} ottelua`},
    {lab:"Eniten tuotuja",p:top(list,"T"),val:p=>p.T,sub:p=>`${p.O} ottelua`},
  ];
  $("leaders").innerHTML = L.filter(x=>x.p).map(x=>`<button class="leader" data-id="${x.p.id}">
    <span class="lab">${x.lab}</span><span class="val">${x.val(x.p)}</span>
    <span class="who">${x.p.nimi} <small>${x.p.jk} · ${x.sub(x.p)}</small></span></button>`).join("");
}

function render(){
  const V = VIEWS[st.nk], cols = V.cols;
  if(!cols.some(c=>c[0]===st.sort) && !["nimi","jk"].includes(st.sort)){ st.sort=V.sort; st.dir=-1; }
  document.querySelectorAll("#nakymat button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.n===st.nk));
  $("tabs").hidden = st.nk==="muutos";
  $("ohje").textContent = V.ohje;
  $("bases").closest("label").hidden = st.nk!=="tilastot";
  $("minlab").textContent = (V.min==="KLYpo" ? "KLY pudotus" : V.min==="LY" ? "L yrit." : V.min) + " vähintään";
  const base = st.jk ? ALL.filter(p=>p.jk===st.jk) : ALL;
  leaders(base);
  const q=st.q.trim().toLowerCase();
  let list = base.filter(p=>(p[V.min]||0)>=st.min && (!q || p.nimi.toLowerCase().includes(q)));
  const key = st.sort==="KandL" ? (p=>p.K*1000+p.L) : (p=>p[st.sort]);
  list.sort((a,b)=>{const x=key(a),y=key(b);
    if(typeof x==="string") return st.dir*x.localeCompare(y,"fi");
    return st.dir*((x??-999)-(y??-999)) || b.YHT-a.YHT;});
  const th = (k,t,cls="") => { const s = st.sort===k ? (st.dir<0?"descending":"ascending") : null;
    return `<th class="${cls}" ${s?`aria-sort="${s}"`:""}><button data-s="${k}">${t}</button></th>`; };
  $("head").innerHTML = `<th class="l"><button tabindex="-1" style="cursor:default">#</button></th>` + th("nimi","Pelaaja","l") + th("jk","Joukkue","l") +
    cols.map(c=>th(c[0], c[1], (c[3]||"").split(" ").filter(x=>x==="pb").join(" "))).join("");
  const pieni = p => (p[V.min]||0) < 10;
  $("body").innerHTML = list.length ? list.map((p,i)=>`<tr data-id="${p.id}" tabindex="0" class="${pieni(p)?"small":""} ${p.id===st.sel?"sel":""}">
    <td class="rk l">${i+1}</td><td class="nm l">${p.nimi}</td><td class="jk l">${p.jk}</td>
    ${cols.map(c=>`<td class="${c[3]||""}">${c[2](p)}</td>`).join("")}
  </tr>`).join("") : `<tr><td colspan="${cols.length+3}" class="empty">Ei pelaajia näillä rajauksilla.</td></tr>`;
  $("count").textContent = `${list.length} pelaajaa`;
  if(st.sel==null && list[0]) st.sel=list[0].id;
  card(ALL.find(p=>p.id===st.sel));
  document.querySelectorAll("tbody tr").forEach(tr=>tr.classList.toggle("sel",+tr.dataset.id===st.sel));
}

/* Prosenttipiste: monenko vertailuryhmän pelaajan luku on pienempi (0–100). */
const PCT_HI="#d8323b", PCT_LO="#3a63b4";
function prosentit(p){
  const pool = ALL.filter(x=>x.KLY>=30);
  const rows = [
    {k:"YHT",f:x=>x.YHT,v:x=>x.YHT},{k:"K",f:x=>x.K,v:x=>x.K},{k:"L",f:x=>x.L,v:x=>x.L},{k:"T",f:x=>x.T,v:x=>x.T},
    {k:"KL%",f:x=>x.KLp,v:x=>fmtP(x.KLp),min:x=>x.KLY>=30},
    {k:"KL%0",f:x=>x.KLp0,v:x=>fmtP(x.KLp0),min:x=>x.KLY0>=10},{k:"KL%1",f:x=>x.KLp1,v:x=>fmtP(x.KLp1),min:x=>x.KLY1>=10},
    {k:"KL%2",f:x=>x.KLp2,v:x=>fmtP(x.KLp2),min:x=>x.KLY2>=10},{k:"KL%3",f:x=>x.KLp3,v:x=>fmtP(x.KLp3),min:x=>x.KLY3>=10},
  ];
  const html = rows.map(r=>{
    const ok = r.min ? r.min(p) : p.KLY>=30;
    const grp = pool.filter(x=>(r.min?r.min(x):true) && r.f(x)!=null);
    if(!ok || grp.length<5) return `<div class="prow na"><span class="k">${r.k}</span><span class="tr"></span><span class="v">${r.v(p)}</span></div>`;
    const val=r.f(p), below=grp.filter(x=>r.f(x)<val).length, eq=grp.filter(x=>r.f(x)===val).length;
    const pc=Math.max(1,Math.min(99,Math.round(100*(below+eq/2)/grp.length)));
    const col=`color-mix(in srgb, ${PCT_HI} ${pc}%, ${PCT_LO})`;
    return `<div class="prow" title="${r.k}: parempi kuin ${pc} % vertailuryhmästä (${grp.length} pelaajaa)"><span class="k">${r.k}</span>
      <span class="tr"><i style="width:${pc}%;background:${col};opacity:.35"></i><b style="left:${pc}%;background:${col}">${pc}</b></span><span class="v">${r.v(p)}</span></div>`;
  }).join("");
  return `<div class="pr"><h4>Prosenttipisteet <small>vertailu: väh. 30 KLY</small></h4>
    <div class="prscale"><span></span><span><span>heikko</span><span>keskitaso</span><span>kärki</span></span><span></span></div>${html}</div>`;
}

/* Kehitys kausittain (runkosarja tai koko kausi sen mukaan, mikä välilehti on valittu) */
function kehitys(p){
  const H=DATA.historia||{}, HK=DATA.hkentat||[], laji = st.v==="kaikki" ? "kaikki" : "runko";
  const kaudet=Object.keys(H).map(Number).sort((a,b)=>a-b);
  const rows=kaudet.map(k=>{const r=(H[k][laji]||{})[String(p.id)]; if(!r) return null; const o=Object.fromEntries(HK.map((h,i)=>[h,r[i]])); o.kausi=k; o.YHT=o.K+o.L+o.T; o.KLp=pct(o.KL,o.KLY); return o;}).filter(Boolean);
  if(rows.length<1) return "";
  const W=300,Hh=150,m={l:8,r:8,t:22,b:22}, n=rows.length, bw=Math.min(38,(W-m.l-m.r)/n*0.55);
  const X=i=>m.l+(i+.5)*(W-m.l-m.r)/n, maxY=Math.max(...rows.map(r=>r.YHT),1);
  const kv=rows.map(r=>r.KLp).filter(v=>v!=null), kmin=Math.max(0,Math.floor((Math.min(...kv)-5)/5)*5), kmax=Math.min(100,Math.ceil((Math.max(...kv)+5)/5)*5);
  const Yb=v=>Hh-m.b-v/maxY*(Hh-m.t-m.b), Yk=v=>Hh-m.b-(v-kmin)/(kmax-kmin||1)*(Hh-m.t-m.b);
  let g=`<line class="base" x1="${m.l}" x2="${W-m.r}" y1="${Hh-m.b}" y2="${Hh-m.b}"/>`;
  rows.forEach((r,i)=>{ g+=`<rect class="bar" x="${X(i)-bw/2}" y="${Yb(r.YHT)}" width="${bw}" height="${Hh-m.b-Yb(r.YHT)}" rx="3"/><text class="vy" x="${X(i)}" y="${Hh-m.b-5}" text-anchor="middle">${r.YHT}</text><text x="${X(i)}" y="${Hh-6}" text-anchor="middle">${r.kausi}</text>`; });
  const pts=rows.map((r,i)=>r.KLp==null?null:[X(i),Yk(r.KLp),r.KLp]).filter(Boolean);
  if(pts.length>1) g+=`<path class="ln" d="M${pts.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L")}"/>`;
  pts.forEach(q=>{ g+=`<circle class="pt" cx="${q[0]}" cy="${q[1]}" r="4"/><text class="vk" x="${q[0]+6}" y="${q[1]-6}">${fmtP(q[2])}</text>`; });
  const tab=rows.slice().reverse().map(r=>{const lg=(DATA.logot||{})[r.jk]; return `<tr class="${r.kausi===DATA.kausi?"nyt":""}"><td class="l">${r.kausi}</td><td class="l">${lg?`<img class="logo-s" src="${lg}" alt="" loading="lazy"> `:""}${r.jk}</td><td>${r.O}</td><td>${r.K}+${r.L}</td><td>${r.T}</td><td>${r.YHT}</td><td>${fmtP(r.KLp)}</td></tr>`}).join("");
  return `<div class="kehitys"><h4>Kehitys <small>${laji==="kaikki"?"koko kausi":"runkosarja"} · palkki YHT, viiva KL%</small></h4>
    <svg class="kchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="YHT ja KL% kausittain">${g}</svg></div>
    <div class="kausit"><table class="ktab"><thead><tr><th class="l">Kausi</th><th class="l">Jk</th><th>O</th><th>K+L</th><th>T</th><th>YHT</th><th>KL%</th></tr></thead><tbody>${tab}</tbody></table></div>`;
}


/* ---- Lyöntiprofiili: lyonnit_<kausi>/p<id>.json, rivi [x m, y m, tilanne 0–7, palot, lyönti 1–3, tulos 0–8, vaihe 0/1] ---- */
const LP_KANSIO = {0:0,1:1,2:2,4:2,3:3,5:3,6:3,7:3};
const LP_NIMET = [["k","Kaikki"],[0,"0-tilanne"],[1,"1-tilanne"],[2,"2-tilanne"],[3,"Takatilanne"]];
const LP_ONN = new Set([0,1,6]);
// Lopputulosryhmät kartalle: väri + muoto (ei pelkkä väri). Laittomat eivät osu kenttään, joten ne eivät ole kartalla.
const LP_RYHMAT = [
  {k:"onn", t:"Onnistui", tt:"kärki eteni, juoksu tai kunnari", c:"var(--win)", m:"o", tul:[0,1,6]},
  {k:"tp", t:"Onnistui, takapalo", tt:"kärki eteni, toinen etenijä paloi", c:"var(--win)", m:"tp", tul:[]},
  {k:"ei", t:"Ei etenemistä", tt:"", c:"var(--muted)", m:"r", tul:[7,8]},
  {k:"koppi", t:"Koppi tai haava", tt:"", c:"var(--accent)", m:"d", tul:[3,5]},
  {k:"palo", t:"Palo", tt:"", c:"var(--loss)", m:"s", tul:[4]},
];
const LP_TUL = {}; LP_RYHMAT.forEach(g=>g.tul.forEach(t=>LP_TUL[t]=g));
const LP_TP = LP_RYHMAT.find(g=>g.k==="tp");
const lpRyhma = r => r[7] && LP_ONN.has(r[5]) ? LP_TP : LP_TUL[r[5]];
const LP_TNIMI = ["kunnari","juoksu","laiton","koppi","palo","haava","kärki eteni","ei edennyt","muu"];
const lpTila = {k:"k"}; const lpVälimuisti = new Map();
function lpHae(id){ if(!lpVälimuisti.has(id)) lpVälimuisti.set(id, fetch(`lyonnit_${DATA.kausi}/p${id}.json`).then(r=>r.ok?r.json():null).catch(()=>null)); return lpVälimuisti.get(id); }
const lpVaihe = () => st.v==="runko" ? [0] : st.v==="kaikki" ? [0,1] : [1];
function lpMerkki(m, x, y, r, c, otsikko){ x=+x; y=+y; const f=v=>v.toFixed(2);
  const t = otsikko ? `<title>${otsikko}</title>` : "";
  if(m==="tp") return `<circle class="m" cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" style="stroke:var(--loss);stroke-width:${r*.55}">${t}</circle>`;
  if(m==="o") return `<circle class="m" cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}">${t}</circle>`;
  if(m==="r") return `<circle class="m" cx="${f(x)}" cy="${f(y)}" r="${r*.85}" fill="none" stroke="${c}" stroke-width="${r*.45}" style="stroke:${c}">${t}</circle>`;
  if(m==="s") return `<rect class="m" x="${f(x-r*.85)}" y="${f(y-r*.85)}" width="${r*1.7}" height="${r*1.7}" fill="${c}">${t}</rect>`;
  if(m==="d") return `<path class="m" d="M${f(x)} ${f(y-r*1.15)}L${f(x+r*1.15)} ${f(y)}L${f(x)} ${f(y+r*1.15)}L${f(x-r*1.15)} ${f(y)}Z" fill="${c}">${t}</path>`;
  return `<path class="m" d="M${f(x)} ${f(y-r*1.2)}L${f(x+r*1.1)} ${f(y+r*.8)}L${f(x-r*1.1)} ${f(y+r*.8)}Z" fill="${c}">${t}</path>`;
}
async function lyontiprofiili(p){
  const el = document.getElementById("lp"); if(!el) return;
  const d = await lpHae(p.id);
  if(document.getElementById("lp")!==el) return;   // valinta vaihtui latauksen aikana
  if(!d || !d.l || !d.l.length){ el.innerHTML = ""; return; }
  const V = lpVaihe();
  const L = d.l.filter(r=>V.includes(r[6]) && r[4]>=1 && r[4]<=3 && r[2] in LP_KANSIO);
  if(!L.length){ el.innerHTML = `<h4>Lyöntiprofiili</h4><p class="note">Ei lyöntejä tässä sarjavaiheessa.</p>`; return; }
  const kansiot = lpTila.k==="k" ? [0,1,2,3] : [lpTila.k];
  const R = L.filter(r=>kansiot.includes(LP_KANSIO[r[2]]));
  // sarja: pohja[vaihe][kansio][palot][lyönti] = [n, onn, laiton]
  const pohja = (pa, ly) => { const s=[0,0,0,0]; for(const v of V) for(const k of kansiot) for(const a of (pa==null?[0,1,2]:[pa])) for(const l of (ly==null?[0,1,2]:[ly])){ const c=DATA.lyontipohja[v][k][a][l]; s[0]+=c[0]; s[1]+=c[1]; s[2]+=c[2]; s[3]+=c[3]||0; } return s; };
  const oma = (pa, ly) => { const s=[0,0,0]; for(const r of R) if((pa==null||Math.min(r[3],2)===pa) && (ly==null||r[4]-1===ly)){ s[0]++; s[1]+=LP_ONN.has(r[5]); s[2]+=r[5]===2; } return s; };
  const solu = (pa, ly) => {
    const o = oma(pa, ly), sa = pohja(pa, ly), op = pct(o[1],o[0]), sp = pct(sa[1],sa[0]);
    if(!o[0]) return `<td class="pieni"><b>–</b><small>0</small></td>`;
    const e = op-sp, vahva = o[0]>=10 && Math.abs(e)>=5;
    const tausta = vahva ? `style="background:color-mix(in srgb, ${e>0?"var(--win)":"var(--loss)"} ${Math.min(34, 10+Math.abs(e))}%, var(--surface-2))"` : "";
    return `<td class="${o[0]<10?"pieni":""}" ${tausta} title="${o[1]}/${o[0]} onnistui · sarja ${fmtP(sp)} %"><b>${Math.round(op)} %</b><small>${o[0]} lyöntiä</small><span class="e">${e>0?"+":"−"}${Math.abs(Math.round(e))} sarja</span></td>`;
  };
  const lkm = k => L.filter(r=>k==="k" || LP_KANSIO[r[2]]===k).length;
  const chips = LP_NIMET.map(([k,t])=>`<button data-lpk="${k}" aria-pressed="${String(k)===String(lpTila.k)}">${t}<small>${lkm(k)}</small></button>`).join("");
  const otsikot = ["1. lyönti","2. lyönti","3. lyönti","Yht."];
  const mx = `<table class="lp-mx" aria-label="Onnistuneiden lyöntien osuus palojen ja lyönnin mukaan">
    <thead><tr><th class="r"></th>${otsikot.map(t=>`<th>${t}</th>`).join("")}</tr></thead>
    <tbody>${[0,1,2].map(pa=>`<tr><th class="r">${pa} ${pa===1?"palo":"paloa"}</th>${[0,1,2,null].map(ly=>solu(pa,ly)).join("")}</tr>`).join("")}
    <tr class="yht"><th class="r">Yht.</th>${[0,1,2,null].map(ly=>solu(null,ly)).join("")}</tr></tbody></table>`;
  // Laittomat ja etenemisen ajoitus lyönneittäin
  const lait = [0,1,2,null].map(ly=>{ const o=oma(null,ly), s=pohja(null,ly); return `<div><b>${fmtP(pct(o[2],o[0]))} %</b><small>sarja ${fmtP(pct(s[2],s[0]))} %</small></div>`; }).join("");
  const onnYht = oma(null,null)[1], sOnn = pohja(null,null)[1];
  const tpOma = ly => { let n=0,t=0; for(const r of R) if(ly==null||r[4]-1===ly){ if(LP_ONN.has(r[5])){ n++; t+=r[7]?1:0; } } return [t,n]; };
  const takapalo = [0,1,2,null].map(ly=>{ const [t,n]=tpOma(ly), s=pohja(null,ly); return `<div title="${t} / ${n} onnistunutta"><b>${fmtP(pct(t,n))} %</b><small>sarja ${fmtP(pct(s[3],s[1]))} %</small></div>`; }).join("");
  const ajoitus = [0,1,2].map(ly=>`<div><b>${fmtP(pct(oma(null,ly)[1], onnYht))} %</b><small>sarja ${fmtP(pct(pohja(null,ly)[1], sOnn))} %</small></div>`).join("") + `<div><b>${onnYht}</b><small>onnistunutta</small></div>`;
  // Kartta: kenttä 42 m × 96 m, kotipesä alhaalla (x −21…21, y 0…96 kotirajasta)
  const K = R.filter(r=>r[5]!==2 && !(r[0]===0&&r[1]===0));
  const X = x => (Math.max(-23,Math.min(23,x))+23).toFixed(1), Y = y => (100-Math.max(-2,Math.min(98,y))).toFixed(1);
  const merkit = LP_RYHMAT.slice().reverse().flatMap(g=>K.filter(r=>lpRyhma(r)===g).map(r=>lpMerkki(g.m, X(r[0]), Y(r[1]), 1.15, g.c,
    `${LP_TNIMI[r[5]]}${r[7]?" (takapalo)":""} · ${r[4]}. lyönti · ${Math.min(r[3],2)} paloa · ${Math.round(r[1])} m`))).join("");
  const kartta = `<svg viewBox="0 0 46 104" role="img" aria-label="Lyöntien osumakohdat kentällä lopputuloksen mukaan">
    <path class="kent" d="M2 4H44V96L27 102H19L2 96Z"/>
    <line class="apu" x1="2" x2="44" y1="${Y(20)}" y2="${Y(20)}"/><line class="apu" x1="2" x2="44" y1="${Y(50)}" y2="${Y(50)}"/>
    <text class="apuT" x="43" y="${+Y(20)-1}" text-anchor="end">20 m</text><text class="apuT" x="43" y="${+Y(50)-1}" text-anchor="end">50 m</text>
    <path class="kent" d="M19.5 100 A3.5 3.5 0 0 1 26.5 100 Z"/>${merkit}</svg>`;
  const sel = `<ul class="lp-sel">${LP_RYHMAT.map(g=>{ const n=K.filter(r=>lpRyhma(r)===g).length;
    return `<li><svg viewBox="-2 -2 4 4">${lpMerkki(g.m,0,0,1.2,g.c,"")}</svg><span>${g.t}</span><b>${n} · ${fmtP(pct(n,K.length))} %</b></li>`; }).join("")}
    <li style="grid-template-columns:1fr;color:var(--muted);font-size:.72rem;margin-top:4px">${K.length} kenttään osunutta lyöntiä. Laittomat (${R.filter(r=>r[5]===2).length}) eivät näy kartalla. Vie osoitin merkin päälle.</li></ul>`;
  const vaiheT = st.v==="runko" ? "runkosarja" : st.v==="kaikki" ? "koko kausi" : "jatkosarja";
  el.innerHTML = `<h4>Lyöntiprofiili <small>jokainen lyönti · ${vaiheT} ${DATA.kausi}</small></h4>
    <div class="lp-chips" role="group" aria-label="Tilanne">${chips}</div>
    <p class="note" style="margin:0 0 6px">Onnistuneiden lyöntien osuus palojen ja lyönnin mukaan. Onnistui = kärkietenijä eteni, juoksu tai kunnari. Vihreä/punainen = vähintään 5 %-yks. sarjaa parempi/heikompi (väh. 10 lyöntiä).</p>
    ${mx}
    <div class="lp-rivi"><span>Laittomat</span>${lait}</div>
    <div class="lp-rivi"><span title="Monennellako lyönnillä onnistuneet lyönnit tulivat">Onnistumisen hetki</span>${ajoitus}</div>
    <div class="lp-rivi"><span title="Onnistuneista lyönneistä ne, joilla kärkietenijä eteni mutta joku muu etenijä paloi">Takapalo</span>${takapalo}</div>
    <div class="lp-kartta">${kartta}${sel}</div>`;
  el.querySelectorAll("[data-lpk]").forEach(b=>b.onclick=()=>{ lpTila.k = b.dataset.lpk==="k" ? "k" : +b.dataset.lpk; lyontiprofiili(p); });
}

function card(p){
  if(!p){$("card").innerHTML=`<p class="note">Valitse pelaaja taulukosta.</p>`;return}
  // Suomalainen pesäpallokenttä (Jugin YDIN 2026 -kenttäkuvan geometria): epäsymmetrinen viisikulmio, koti alhaalla,
  // ykköspesä kotipesän ja kolmospesän välisellä linjalla, kakkonen oikealla ja kolmonen vasemmalla sivurajalla.
  // Jokaisessa pesässä kärkilyöntiprosentti tilanteessa, jossa kärkietenijä on tällä pesällä (KL%0 = kotipesältä).
  // Laatikot pesävälien keskelle: KL%0 koti–1, KL%1 1–2, KL%2 2–3, KL%3 3–koti (keskipiste x,y).
  // Kolmoselta kotiin juostaan kentän vasemman rajan ulkopuolelta (ykköspesän vasen puoli on turva-alue), siksi KL%3 rajan ulkopuolella.
  const B=[
    {n:0, x:142, y:584, t:"kentällemeno"},
    {n:1, x:228, y:432, t:"1-tilanne"},
    {n:2, x:190, y:352, t:"2-tilanne"},
    {n:3, x:12,  y:452, t:"kotiutus"},
  ];
  const vals=B.map(b=>p["KLp"+b.n]);
  const best=Math.max(...vals.map((v,i)=>p["KLY"+i]>=10?v:-1));
  const svg=`<svg class="field-svg" viewBox="-56 268 426 440" role="img" aria-label="Kärkilyöntiprosentit pesäpallokentällä: KL%0 kotipesältä, KL%1, KL%2 ja KL%3">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface)" stop-opacity="1"/><stop offset="1" stop-color="var(--surface)" stop-opacity="0"/></linearGradient></defs>
    <path class="kentta" d="M25 236 L25 495 L152 655 L198 655 L358 405 L358 236 Z"/>
    <path class="raja" d="M25 236 L25 495 L152 655 M198 655 L358 405 L358 236"/>
    <path class="raja" d="M136 655 L370 655"/>
    <path class="kp" d="M146 655 A44 44 0 0 0 234 655 Z"/><path class="kpk" d="M158 655 A32 32 0 0 0 222 655"/>
    <path class="linja" d="M25 352 L358 352 M100 507 L358 352 M25 400 L190 655"/>
    <path class="paluu" d="M14 360 L12 498 L140 664 L172 676"/>
    <path class="pesa" d="M25 335 A17 17 0 0 1 25 369 Z"/><path class="pesa" d="M358 335 A17 17 0 0 0 358 369 Z"/>
    <circle class="pesa" cx="100" cy="507" r="11"/><circle class="lautanen" cx="190" cy="655" r="7"/>
    <rect x="0" y="236" width="370" height="40" fill="url(#fade)"/>
    ${B.map((b,i)=>{const v=vals[i],y=p["KLY"+b.n],hot=y>=10&&v===best&&best>=0, pieni=y>0&&y<10;
      return `<g class="chip ${hot?"hot":""} ${pieni?"pieni":""}"><rect x="${b.x-64}" y="${b.y-33}" width="128" height="66" rx="10"/>
      <text class="lbl" x="${b.x}" y="${b.y-15}" text-anchor="middle"><tspan class="k">KL%${b.n}</tspan> ${b.t}</text>
      <text class="pct" x="${b.x}" y="${b.y+11}" text-anchor="middle">${fmtP(v)}${v==null?"":" %"}</text>
      <text class="cnt" x="${b.x}" y="${b.y+26}" text-anchor="middle">${p["KL"+b.n]}/${y}${pieni?" · pieni otos":""}</text></g>`}).join("")}
  </svg>`;
  const kuva=(DATA.kuvat||{})[String(p.id)], logo=(DATA.logot||{})[p.jk];
  const ini=p.nimi.split(" ").map(x=>x[0]).slice(0,2).join("");
  $("card").innerHTML=`<div class="ph">${kuva?`<img class="kuva" src="${kuva}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;ini&quot;>${ini}</span>'">`:`<span class="ini">${ini}</span>`}
    <div><h2>${p.nimi}</h2><div class="meta">${logo?`<img class="logo-s" src="${logo}" alt="" loading="lazy">`:""}${p.jk} · ${p.O} ottelua · ${p.LV} lyöntivuoroa</div></div></div>
    <div class="kpis"><div class="kpi"><span>K+L</span><strong>${p.K}+${p.L}</strong></div>
    <div class="kpi"><span>T</span><strong>${p.T}</strong></div>
    <div class="kpi"><span>YHT</span><strong>${p.YHT}</strong></div>
    <div class="kpi"><span>KL%</span><strong>${fmtP(p.KLp)}</strong></div></div>
    <div class="kenttabox"><h4>Kärkilyönnit pesittäin <small>kärkietenijän lähtöpesä</small></h4>${svg}
    <p class="note">KL%1 = 1-tilanteen purku eli kärkietenijä ykköspesällä, KL%2 = 2-tilanne, KL%3 = kotiutus kolmospesältä, KL%0 = kentällemeno tyhjiltä pesiltä. Korostettu = pelaajan vahvin (väh. 10 yritystä).</p></div>
    <div class="lp" id="lp"><p class="note">Ladataan lyöntiprofiilia…</p></div>
    ${prosentit(p)}
    ${kehitys(p)}
    ${kuva||logo?`<p class="kred">Kuvat ja logot: pesistulokset.fi</p>`:""}`;
  lyontiprofiili(p);
}

$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.v=b.dataset.v;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();load();});
$("nakymat").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(!b)return;st.nk=b.dataset.n;st.sort=VIEWS[st.nk].sort;st.dir=-1;st.sel=null;st.min=VIEWS[st.nk].def;$("minkly").value=st.min;$("minklyv").textContent=st.min;save();load();});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.jk=b.dataset.t==="Kaikki"?null:b.dataset.t;st.sel=null;buildChips();render();});
$("q").addEventListener("input",e=>{st.q=e.target.value;render();});
$("minkly").addEventListener("input",e=>{st.min=+e.target.value;$("minklyv").textContent=st.min;render();});
$("bases").addEventListener("change",e=>$("tablebox").classList.toggle("showbases",e.target.checked));
$("head").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b)return;const s=b.dataset.s;
  if(st.sort===s) st.dir*=-1; else {st.sort=s;st.dir=(s==="nimi"||s==="jk")?1:-1;} save();render();});
const pick=id=>{st.sel=+id;render(); if(window.innerWidth<1100) $("card").scrollIntoView({behavior:"smooth",block:"start"});};
$("body").addEventListener("click",e=>{const tr=e.target.closest("tr[data-id]");if(tr)pick(tr.dataset.id);});
$("body").addEventListener("keydown",e=>{if(e.key==="Enter"){const tr=e.target.closest("tr[data-id]");if(tr)pick(tr.dataset.id);}});
$("leaders").addEventListener("click",e=>{const b=e.target.closest(".leader");if(b)pick(b.dataset.id);});

try{ const q=new URLSearchParams(location.search).get("p"); if(q){ const id=+q; st.sel=id; st.nk="tilastot";
  if(!rows(st.v).some(r=>r.id===id)) st.v="kaikki"; } }catch(e){}
document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===st.v));
st.min=VIEWS[st.nk].def; $("minkly").value=st.min; $("minklyv").textContent=st.min;
load();
if(st.sel){ const el = window.innerWidth<1100 ? $("card") : document.querySelector(`tr[data-id="${st.sel}"]`); if(el) el.scrollIntoView({block: window.innerWidth<1100 ? "start" : "center"}); }
</script>
